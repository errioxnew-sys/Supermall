<header class="sticky top-0 z-40 bg-white/95 backdrop-blur-md border-b border-stone-200">
  <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8">
    <div class="flex items-center justify-between h-16 gap-4">
      
      <!-- Brand Logo -->
      <a href="{% url 'mall:home' %}" class="flex items-center gap-2.5 group">
        <div class="w-10 h-10 rounded-xl bg-gradient-to-tr from-amber-700 to-amber-500 flex items-center justify-center text-white shadow-sm group-hover:scale-105 transition-transform">
          <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M16 11V7a4 4 0 00-8 0v4M5 9h14l1 12H4L5 9z"></path>
          </svg>
        </div>
        <div>
          <span class="font-serif font-extrabold text-xl tracking-tight text-stone-900 block leading-tight">SuperMall</span>
          <span class="text-[10px] tracking-wider uppercase text-stone-400 font-semibold block">Malawi Digital Mall</span>
        </div>
      </a>

      <!-- Mall Search bar -->
      <div class="hidden md:flex flex-1 max-w-md mx-4">
        <form action="{% url 'mall:explore' %}" method="GET" class="w-full relative">
          <input 
            type="text" 
            name="q" 
            value="{{ query|default:'' }}"
            placeholder="Search stores, chitenge fashion, cafes, spas..." 
            class="w-full bg-stone-50 border border-stone-200 rounded-full py-2 pl-10 pr-4 text-xs text-stone-900 placeholder:text-stone-400 focus:outline-none focus:ring-2 focus:ring-amber-500/20 focus:border-amber-500 transition-all"
          />
          <div class="absolute inset-y-0 left-0 pl-3.5 flex items-center pointer-events-none text-stone-400">
            <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M21 21l-6-6m2-5a7 7 0 11-14 0 7 7 0 0114 0z"></path></svg>
          </div>
        </form>
      </div>

      <!-- Navigation & Portal Links -->
      <nav class="flex items-center gap-2 sm:gap-3 text-xs font-semibold">
        <a href="{% url 'mall:explore' %}" class="px-3 py-2 rounded-lg text-stone-700 hover:text-stone-900 hover:bg-stone-100 transition-colors {% if active_nav == 'explore' %}bg-stone-100 text-stone-900{% endif %}">
          Explore Shops
        </a>

        <!-- Merchant Portal Dropdown -->
        <div class="relative group">
          <button class="px-3 py-2 rounded-lg text-stone-700 hover:text-stone-900 hover:bg-stone-100 flex items-center gap-1 transition-colors">
            <span>Store Portals</span>
            <svg class="w-3.5 h-3.5 text-stone-400" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M19 9l-7 7-7-7"></path></svg>
          </button>
          <div class="absolute right-0 mt-1 w-64 bg-white border border-stone-200 rounded-xl shadow-xl py-2 hidden group-hover:block z-50">
            <div class="px-3 py-1.5 text-[10px] font-bold tracking-wider text-stone-400 uppercase">Manage Merchant Hub</div>
            {% for biz in all_businesses|slice:":6" %}
              <a href="{% url 'mall:merchant_dashboard' slug=biz.slug %}" class="flex items-center gap-2.5 px-3 py-2 text-stone-800 hover:bg-amber-50 hover:text-amber-900 transition-colors">
                <img src="{{ biz.logo }}" class="w-6 h-6 rounded-md object-cover border border-stone-200" alt="{{ biz.name }}">
                <div class="truncate text-xs">
                  <p class="font-medium truncate">{{ biz.name }}</p>
                  <span class="text-[10px] text-stone-400">{{ biz.city }} • Dashboard</span>
                </div>
              </a>
            {% empty %}
              <p class="px-3 py-2 text-stone-500 text-xs">No merchants found.</p>
            {% endfor %}
          </div>
        </div>

        <!-- SuperMall Admin Console -->
        <a href="{% url 'mall:admin_panel' %}" class="px-3 py-2 rounded-lg bg-stone-900 text-white hover:bg-stone-800 transition-colors flex items-center gap-1.5 shadow-xs">
          <svg class="w-3.5 h-3.5 text-amber-400" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M10.325 4.317c.426-1.756 2.924-1.756 3.35 0a1.724 1.724 0 002.573 1.066c1.543-.94 3.31.826 2.37 2.37a1.724 1.724 0 001.065 2.572c1.756.426 1.756 2.924 0 3.35a1.724 1.724 0 00-1.066 2.573c.94 1.543-.826 3.31-2.37 2.37a1.724 1.724 0 00-2.572 1.065c-.426 1.756-2.924 1.756-3.35 0a1.724 1.724 0 00-2.573-1.066c-1.543.94-3.31-.826-2.37-2.37a1.724 1.724 0 00-1.065-2.572c-1.756-.426-1.756-2.924 0-3.35a1.724 1.724 0 001.066-2.573c-.94-1.543.826-3.31 2.37-2.37.996.608 2.296.07 2.572-1.065z"></path><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 12a3 3 0 11-6 0 3 3 0 016 0z"></path></svg>
          <span>Admin</span>
        </a>
      </nav>

    </div>
  </div>
</header>
