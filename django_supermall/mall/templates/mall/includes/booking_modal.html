<!-- Appointment Booking Modal -->
<div id="bookingModal" class="fixed inset-0 z-50 hidden flex items-center justify-center bg-stone-900/60 backdrop-blur-xs p-4">
  <div class="bg-white rounded-2xl max-w-lg w-full p-6 text-left space-y-4 shadow-2xl border border-stone-200 animate-in fade-in zoom-in duration-200">
    
    <div class="flex items-center justify-between border-b border-stone-100 pb-3">
      <div>
        <span class="text-[10px] font-bold text-amber-600 uppercase tracking-wider">Appointment Reservation</span>
        <h3 id="bookingServiceName" class="font-serif font-bold text-lg text-stone-900">Book Service</h3>
        <p id="bookingServicePrice" class="text-xs font-bold text-stone-600 mt-0.5">MWK 0</p>
      </div>
      <button onclick="BookingApp.close()" class="text-stone-400 hover:text-stone-800 p-1.5 rounded-lg hover:bg-stone-100">
        <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M6 18L18 6M6 6l12 12"></path></svg>
      </button>
    </div>

    <div class="space-y-3 text-xs">
      <div class="grid grid-cols-1 sm:grid-cols-2 gap-3">
        <div>
          <label class="block text-stone-700 font-medium mb-1">Your Full Name *</label>
          <input type="text" id="bookingCustomerName" placeholder="Kondwani Phiri" class="w-full bg-stone-50 border border-stone-200 rounded-lg p-2 focus:ring-2 focus:ring-amber-500/20 focus:border-amber-500 focus:outline-none">
        </div>
        <div>
          <label class="block text-stone-700 font-medium mb-1">Phone Number (WhatsApp) *</label>
          <input type="tel" id="bookingCustomerPhone" placeholder="+265 999 123 456" class="w-full bg-stone-50 border border-stone-200 rounded-lg p-2 focus:ring-2 focus:ring-amber-500/20 focus:border-amber-500 focus:outline-none">
        </div>
      </div>

      <div>
        <label class="block text-stone-700 font-medium mb-1">Email Address (Optional)</label>
        <input type="email" id="bookingCustomerEmail" placeholder="kondwani@example.com" class="w-full bg-stone-50 border border-stone-200 rounded-lg p-2 focus:ring-2 focus:ring-amber-500/20 focus:border-amber-500 focus:outline-none">
      </div>

      <div class="grid grid-cols-1 sm:grid-cols-2 gap-3">
        <div>
          <label class="block text-stone-700 font-medium mb-1">Preferred Date *</label>
          <input type="date" id="bookingDate" class="w-full bg-stone-50 border border-stone-200 rounded-lg p-2 focus:ring-2 focus:ring-amber-500/20 focus:border-amber-500 focus:outline-none">
        </div>
        <div>
          <label class="block text-stone-700 font-medium mb-1">Preferred Time Slot *</label>
          <select id="bookingTimeSlot" class="w-full bg-stone-50 border border-stone-200 rounded-lg p-2 focus:ring-2 focus:ring-amber-500/20 focus:border-amber-500 focus:outline-none cursor-pointer">
            <option value="09:00 AM">09:00 AM - Morning Slot</option>
            <option value="11:00 AM">11:00 AM - Midday Slot</option>
            <option value="02:00 PM">02:00 PM - Afternoon Slot</option>
            <option value="04:00 PM">04:00 PM - Late Afternoon</option>
          </select>
        </div>
      </div>

      <div>
        <label class="block text-stone-700 font-medium mb-1">Special Notes / Requests</label>
        <textarea id="bookingNotes" rows="2" placeholder="Specific hair braid style, fitting requirement, dietary note..." class="w-full bg-stone-50 border border-stone-200 rounded-lg p-2 focus:ring-2 focus:ring-amber-500/20 focus:border-amber-500 focus:outline-none"></textarea>
      </div>
    </div>

    <div class="pt-3 border-t border-stone-100 flex items-center justify-end gap-3">
      <button onclick="BookingApp.close()" class="px-4 py-2 border border-stone-200 rounded-xl text-stone-600 hover:bg-stone-50 font-semibold text-xs">
        Cancel
      </button>
      <button id="bookingSubmitBtn" onclick="BookingApp.submit()" class="px-5 py-2 bg-amber-600 hover:bg-amber-700 text-white rounded-xl font-bold text-xs shadow-md transition-colors">
        Confirm Appointment
      </button>
    </div>

  </div>
</div>
